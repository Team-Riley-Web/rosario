name: Rebuild site when products change

# Product pages are baked at build time from Shopify, so a newly launched
# product is searchable (live Storefront API) before its page exists. This job
# is the ONLY trigger: it fingerprints the catalog's product HANDLES hourly and
# calls the Netlify build hook when that set changes.
#
# There is deliberately NO Shopify "Product creation" webhook.
# It used to be the fast path (~2-4 min), but it fired the instant a product
# was published — and the shop's actual workflow is to DUPLICATE an existing
# product, publish it, and only then spend several minutes replacing the
# photos and title. So the webhook build reliably baked the *source* product's
# images into the new page, and nothing ever corrected it: the handle already
# existed, so this job's fingerprint was unchanged and it skipped the rebuild.
# That is exactly what happened to the silver-foil-ribbon-beads necklace on
# 2026-08-30 (published 17:48Z, photos uploaded 17:49-17:55Z, page shipped with
# a pink necklace's photos and stayed wrong for ~22h).
#
# Building on a delay instead of on the webhook is both more correct and
# cheaper: by the time the hourly check runs, the photos are done, so a listing
# goes live once, with the right images, in one build instead of two.
#
# Hashing handles (not updatedAt) is what keeps this cheap: a new product adds
# a handle and a removed one drops it, but editing a price, description, or
# image changes nothing here — so routine edits cost zero build minutes. Any
# build that does run rebuilds every page, so content edits ride along with the
# next launch. The last fingerprint lives in the Actions cache, never in a
# commit, so it can't itself trigger a deploy. This repo is public, so the
# hourly Actions run is free.

on:
  schedule:
    - cron: '0 * * * *' # hourly; GitHub delays scheduled runs under load
  workflow_dispatch: {}

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous catalog fingerprint
        uses: actions/cache/restore@v4
        with:
          path: fingerprint.txt
          key: products-fingerprint-${{ github.run_id }}
          restore-keys: |
            products-fingerprint-

      - name: Fingerprint the Shopify catalog
        id: check
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
        run: |
          set -euo pipefail

          catalog=""
          cursor=""
          while :; do
            if [ -z "$cursor" ]; then after=""; else after=", after: \\\"$cursor\\\""; fi
            resp=$(curl -sf "https://${SHOPIFY_STORE_DOMAIN}/api/2026-01/graphql.json" \
              -H "Content-Type: application/json" \
              -H "X-Shopify-Storefront-Access-Token: ${SHOPIFY_STOREFRONT_TOKEN}" \
              -d "{\"query\":\"query { products(first: 250${after}) { pageInfo { hasNextPage endCursor } edges { node { handle } } } }\"}")
            page=$(echo "$resp" | jq -r '.data.products.edges[].node.handle')
            catalog="${catalog}${page}"$'\n'
            if [ "$(echo "$resp" | jq -r '.data.products.pageInfo.hasNextPage')" = "true" ]; then
              cursor=$(echo "$resp" | jq -r '.data.products.pageInfo.endCursor')
            else
              break
            fi
          done

          count=$(echo "$catalog" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "Shopify returned zero products — refusing to fingerprint (likely an API problem)" >&2
            exit 1
          fi

          fingerprint=$(echo "$catalog" | sort | sha256sum | cut -d' ' -f1)
          previous=$(cat fingerprint.txt 2>/dev/null || echo "none")
          echo "Products: $count | fingerprint: $fingerprint | previous: $previous"

          if [ "$fingerprint" != "$previous" ]; then
            echo "Catalog gained or lost a product — triggering rebuild"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new or removed products — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$fingerprint" > fingerprint.txt

      - name: Trigger Netlify build
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$NETLIFY_BUILD_HOOK_URL" -d '{}'
          echo "Netlify build triggered."

      - name: Remember catalog fingerprint
        uses: actions/cache/save@v4
        with:
          path: fingerprint.txt
          key: products-fingerprint-${{ github.run_id }}
