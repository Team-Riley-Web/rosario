name: Manual site rebuild

# Product-created webhooks trigger the Netlify build hook directly, so launches
# deploy immediately. Keep this manual action as an emergency rebuild button.

on:
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$NETLIFY_BUILD_HOOK_URL" -d '{}'
          echo "Netlify build triggered."
