[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Products published in Shopify since the last build have no static page yet
# (rebuild-on-product-changes picks them up on its next scheduled run). Serve the
# "going live shortly" page instead of letting the catch-all render the
# homepage. Netlify skips this rule once a real /products/<handle> page exists.
#
# 404, not 200: the page truly does not exist yet, and a 200 would let Facebook
# cache the pending card against the product's URL and keep showing it after
# the real page ships. Netlify still serves this body, so a visitor who clicks
# gets the explanation.
[[redirects]]
  from = "/products/*"
  to = "/listing-pending/index.html"
  status = "404"

[[redirects]]
  from = "/discount/*"
  to = "/discount/index.html"
  status = "200"

[[redirects]]
  from = "/:discount_code"
  to = "/discount/index.html"
  status = "200"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = "200"
