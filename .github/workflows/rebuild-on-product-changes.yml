name: Rebuild site when products change

# Product pages are baked at build time from Shopify, so a newly launched
# product is searchable (live Storefront API) before its page exists. This job
# is the ONLY trigger: it fingerprints the catalog's product HANDLES hourly and
# calls the Netlify build hook when that set changes.
#
# There is deliberately NO Shopify "Product creation" webhook.
# It used to be the fast path (~2-4 min), but it fired the instant a product
# was published — and the shop's actual workflow is to DUPLICATE an existing
# product, publish it, and only then spend several minutes replacing the
# photos and title. So the webhook build reliably baked the *source* product's
# images into the new page, and nothing ever corrected it: the handle already
# existed, so this job's fingerprint was unchanged and it skipped the rebuild.
# That is exactly what happened to the silver-foil-ribbon-beads necklace on
# 2026-08-30 (published 17:48Z, photos uploaded 17:49-17:55Z, page shipped with
# a pink necklace's photos and stayed wrong for ~22h).
#
# Building on a delay instead of on the webhook is both more correct and
# cheaper: by the time the hourly check runs, the photos are done, so a listing
# goes live once, with the right images, in one build instead of two. The DELAY
# is what this job's hourly cadence buys us — it must not also come from the
# API being slow to admit the product exists (see below).
#
# The catalog is read from the ADMIN API, not the Storefront API.
# The Storefront `products` connection is backed by an index that can lag badly
# behind reality: untitled-sep6_16-53-20 was created 2026-09-06T21:53Z and did
# not appear in that list until somewhere between 2026-09-07T15:38Z and 19:24Z
# — ~21h. Six consecutive hourly runs fingerprinted an identical 335 handles,
# saw no change, and skipped the build, so the product had no page and Netlify
# served the pending placeholder for links the shop owner had already posted to
# Facebook. (A sibling product, untitled-sep4_22-08-26, showed up in 2.3h, so
# the lag is unpredictable, not a fixed offset.) The Admin API reports a product
# as soon as it exists, so the only delay left is this job's own hourly cadence.
#
# The filter is scoped to the HEADLESS publication, not `published_status:published`.
# The site's Storefront token reads the "Rosario Leonardi Murano Glass Headless"
# channel, and `published_status:published` means published to the ONLINE STORE
# — a different set. On 2026-09-07 that gap was 32 products: active, live-looking
# in Shopify admin, published to Online Store / Meta / Copilot, but absent from
# Headless and therefore invisible to the build (27 of them from a single
# 2026-06-25 batch). Fingerprinting the online-store set would track 32 handles
# the build cannot render, so publishing a product to Online Store alone would
# change the hash, spend a build, and still produce no page.
#
# Scoped to Headless the Admin API and Storefront API agree exactly — same 336
# handles, same hash — so the fingerprint means "what the site can build," while
# still being read from the API that has no index lag. Re-derive the ID with:
#   { publications(first: 20) { edges { node { id name } } } }
#
# `status:active` additionally excludes drafts, so the fingerprint still changes
# at PUBLISH time, which is what preserves the photos-are-done-by-then property
# described above.
#
# Auth is the client credentials grant, not a permanent token. Admin-created
# custom apps (the old Settings > Apps > Develop apps flow that handed out a
# permanent shpat_...) were discontinued 2026-01-01, and Dev Dashboard apps
# expose only a client ID and secret. Those exchange for an access token that
# lives 24h, so this job mints a fresh one per run and never stores or refreshes
# anything. Requirements: the app must be installed on the store, the store and
# app must sit in the same Shopify organization, and the app version must carry
# read_products (the grant has no scope parameter — scopes are a readback of the
# Dev Dashboard version, which is why the scope is asserted below).
#
# Hashing handles (not updatedAt) is what keeps this cheap: a new product adds
# a handle and a removed one drops it, but editing a price, description, or
# image changes nothing here — so routine edits cost zero build minutes. Any
# build that does run rebuilds every page, so content edits ride along with the
# next launch. The last fingerprint lives in the Actions cache, never in a
# commit, so it can't itself trigger a deploy. This repo is public, so the
# hourly Actions run is free.

on:
  schedule:
    - cron: '0 * * * *' # hourly; GitHub delays scheduled runs under load
  workflow_dispatch: {}

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous catalog fingerprint
        uses: actions/cache/restore@v4
        with:
          path: fingerprint.txt
          key: products-fingerprint-${{ github.run_id }}
          restore-keys: |
            products-fingerprint-

      - name: Fingerprint the Shopify catalog
        id: check
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Publication id of the headless channel the site's Storefront token reads.
          # Store-internal, not a credential. See the note above to re-derive it.
          HEADLESS_PUBLICATION_ID: '167856570555'
        run: |
          set -euo pipefail

          # An empty secret reads as a valid-looking request that fails obscurely
          # downstream (a blank one got stored once because `gh secret set`
          # prompts interactively and had no tty). Name it here instead.
          for v in SHOPIFY_STORE_DOMAIN SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET; do
            if [ -z "${!v:-}" ]; then
              echo "Secret $v is unset or empty." >&2
              exit 1
            fi
          done

          # No -f: a 401 here should print Shopify's error body, not die silently.
          token_resp=$(curl -s -X POST \
            "https://${SHOPIFY_STORE_DOMAIN}/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SHOPIFY_CLIENT_ID}" \
            --data-urlencode "client_secret=${SHOPIFY_CLIENT_SECRET}")

          # The endpoint does not always answer JSON on failure, so jq must not be
          # the thing that reports the error — piping a plain-text 401 into it
          # aborts the step under `set -e` before any diagnosis is printed.
          admin_token=$(echo "$token_resp" | jq -r '.access_token // empty' 2>/dev/null || true)
          if [ -z "$admin_token" ]; then
            echo "Client credentials exchange returned no access_token. Response:" >&2
            echo "$token_resp" | head -c 500 | sed -E 's/shp[a-z]{2}_[A-Za-z0-9]+/<redacted>/g' >&2
            exit 1
          fi
          echo "::add-mask::$admin_token"

          # The grant can't request scopes, so a Dev Dashboard version missing
          # read_products yields a valid token that returns an empty catalog.
          # Assert instead, or we're back to a silently wrong fingerprint.
          granted=$(echo "$token_resp" | jq -r '.scope // ""')
          case " ${granted//,/ } " in
            *" read_products "*) ;;
            *) echo "App version lacks read_products (granted: '$granted')" >&2; exit 1 ;;
          esac

          catalog=""
          cursor=""
          while :; do
            if [ -z "$cursor" ]; then after=""; else after=", after: \\\"$cursor\\\""; fi
            resp=$(curl -sf "https://${SHOPIFY_STORE_DOMAIN}/admin/api/2026-01/graphql.json" \
              -H "Content-Type: application/json" \
              -H "X-Shopify-Access-Token: ${admin_token}" \
              -d "{\"query\":\"query { products(first: 250, query: \\\"status:active AND published_status:${HEADLESS_PUBLICATION_ID}-published\\\"${after}) { pageInfo { hasNextPage endCursor } edges { node { handle } } } }\"}")

            # A bad token or a missing read_products scope still answers 200 with
            # an `errors` array. Left unchecked that yields an empty-but-stable
            # catalog, i.e. a silently wrong fingerprint — fail loudly instead.
            if [ "$(echo "$resp" | jq -r 'has("errors")')" = "true" ]; then
              echo "Shopify Admin API returned errors:" >&2
              echo "$resp" | jq -r '.errors' >&2
              exit 1
            fi

            page=$(echo "$resp" | jq -r '.data.products.edges[].node.handle')
            catalog="${catalog}${page}"$'\n'
            if [ "$(echo "$resp" | jq -r '.data.products.pageInfo.hasNextPage')" = "true" ]; then
              cursor=$(echo "$resp" | jq -r '.data.products.pageInfo.endCursor')
            else
              break
            fi
          done

          count=$(echo "$catalog" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "Shopify returned zero products — refusing to fingerprint (likely an API problem)" >&2
            exit 1
          fi

          fingerprint=$(echo "$catalog" | sort | sha256sum | cut -d' ' -f1)
          previous=$(cat fingerprint.txt 2>/dev/null || echo "none")
          echo "Products: $count | fingerprint: $fingerprint | previous: $previous"

          if [ "$fingerprint" != "$previous" ]; then
            echo "Catalog gained or lost a product — triggering rebuild"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new or removed products — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s' "$fingerprint" > fingerprint.txt

      - name: Trigger Netlify build
        if: steps.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          curl -sf -X POST "$NETLIFY_BUILD_HOOK_URL" -d '{}'
          echo "Netlify build triggered."

      - name: Remember catalog fingerprint
        uses: actions/cache/save@v4
        with:
          path: fingerprint.txt
          key: products-fingerprint-${{ github.run_id }}
